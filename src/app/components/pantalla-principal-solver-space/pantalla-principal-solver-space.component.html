<div class="screen first-screen">
  <div class="worker-info">
    <h1>Bienvenido, {{ workerName }}</h1>
    <p>Explora retos y colabora con otros innovadores.</p>
  </div>
</div>

<div class="screen second-screen">
  <h2>Retos Destacados</h2>
  <div class="carousel-container">
    <div id="challengeCarousel" class="carousel slide" data-bs-ride="carousel">
      <div class="carousel-inner">
        <div
          *ngFor="let challenge of challenges; let i = index"
          [ngClass]="{ 'carousel-item': true, active: i === 0 }"
        >
          <div class="carousel-content">
            <h3>{{ challenge.title }}</h3>
            <p>{{ challenge.description }}</p>
            <button class="btn btn-primary" (click)="viewChallenge(challenge.id)">Ver más</button>
          </div>
        </div>
      </div>
      <button
        class="carousel-control-prev"
        type="button"
        data-bs-target="#challengeCarousel"
        data-bs-slide="prev"
      >
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Anterior</span>
      </button>
      <button
        class="carousel-control-next"
        type="button"
        data-bs-target="#challengeCarousel"
        data-bs-slide="next"
      >
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Siguiente</span>
      </button>
    </div>
  </div>
</div>

<div class="screen third-screen">
  <h2>Top 5 Trabajadores del Mes</h2>
  <div class="top-workers">
    <div *ngFor="let worker of workers" class="worker-card">
      <img [src]="worker.photo" [alt]="worker.name" />
      <h3>{{ worker.name }}</h3>
      <p>{{ worker.position }}</p>
    </div>
  </div>
</div>
